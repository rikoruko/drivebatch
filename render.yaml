services:
  - type: web
    name: drivebatch
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 600
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CLOUDCONVERT_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production
