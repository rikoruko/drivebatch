services:
  - type: web
    name: drivebatch
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 600
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_SECRET_JSON
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
