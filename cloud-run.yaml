apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: drivebatch
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "1"
    spec:
      containerConcurrency: 10
      timeoutSeconds: 3600
      containers:
        - image: IMAGE_URI
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          env:
            - name: FLASK_ENV
              value: production
            - name: GCS_BUCKET
              value: REPLACE_WITH_BUCKET_NAME
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-api-key
                  key: latest
            - name: GOOGLE_CLIENT_SECRET_JSON
              valueFrom:
                secretKeyRef:
                  name: google-client-secret-json
                  key: latest
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: drivebatch-secret-key
                  key: latest
            - name: OAUTH_REDIRECT_URI
              value: REPLACE_WITH_PUBLIC_CALLBACK_URL
            - name: CLOUDCONVERT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudconvert-api-key
                  key: latest
